[tools]
bun = "latest"

[env]
BINDIR = "./bin"

[tasks.setup]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run in dev mode"
depends = ["setup"]
run = "bun run tauri dev"

[tasks.build]
description = "Build production release"
depends = ["setup"]
run = "bun run tauri build --no-bundle"

[tasks.deploy]
description = "Deploy production binary"
depends = ["build"]
run = "mkdir -p \"$BINDIR\" && cp src-tauri/target/release/open-with \"$BINDIR/\""

[tasks.reset]
description = "Reset database"
run = "./reset"
